<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Checkmate — Games by Link</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/board.css" />
<link rel="stylesheet" href="styles/games.css" />
<link rel="stylesheet" href="styles/mobile.css" />
<link rel="stylesheet" href="styles/desktop.css" />
</head>
<body>
<div id="live-region" aria-live="polite" class="sr-only"></div>

<!-- First run: ask for a display name -->
<div id="welcome-modal" class="sheet-modal hidden" role="dialog" aria-modal="true" data-i18n-aria="welcome.title">
  <div class="sheet">
    <h2 data-i18n="welcome.title">Welcome</h2>
    <p class="sheet-hint" data-i18n="welcome.hint"></p>
    <label class="field">
      <span data-i18n="settings.name">Your name</span>
      <input type="text" id="welcome-name" maxlength="24" autocomplete="nickname" data-i18n-placeholder="settings.namePlaceholder" />
    </label>
    <button type="button" id="welcome-start-btn" class="btn btn-primary btn-lg" data-i18n="welcome.start">Continue</button>
  </div>
</div>

<!-- Settings -->
<div id="settings-modal" class="sheet-modal hidden" role="dialog" aria-modal="true" data-i18n-aria="settings.title">
  <div class="sheet">
    <h2 data-i18n="settings.title">Settings</h2>
    <label class="field">
      <span data-i18n="settings.name">Your name</span>
      <input type="text" id="settings-name" maxlength="24" autocomplete="nickname" data-i18n-placeholder="settings.namePlaceholder" />
    </label>
    <label class="field">
      <span data-i18n="settings.language">Language</span>
      <select id="lang-select" class="field-input"></select>
    </label>
    <label class="toggle-row">
      <input type="checkbox" id="rotate-toggle" />
      <span data-i18n="setup.rotateToggle">Rotate board each turn</span>
    </label>
    <label class="toggle-row">
      <input type="checkbox" id="handoff-toggle" />
      <span data-i18n="setup.handoffToggle">Show handoff screen</span>
    </label>
    <label class="toggle-row">
      <input type="checkbox" id="notify-toggle" />
      <span data-i18n="settings.notify">Notify me about opponent moves</span>
    </label>
    <p class="sheet-hint" id="notify-hint" data-i18n="settings.notifyHint"></p>
    <div class="field">
      <span data-i18n="settings.identity">Your ID</span>
      <code id="settings-pubkey" class="identity"></code>
      <p class="sheet-hint" data-i18n="settings.identityHint"></p>
    </div>
    <button type="button" id="settings-close-btn" class="btn btn-primary btn-lg" data-i18n="btn.done">Done</button>
  </div>
</div>

<!-- Send your move: a sheet, so the game screen itself never needs to scroll -->
<div id="send-modal" class="sheet-modal hidden" role="dialog" aria-modal="true" data-i18n-aria="panel.sendMove">
  <div class="sheet sheet-compact">
    <h2 data-i18n="panel.sendMove">Send your move</h2>
    <p class="sheet-hint" data-i18n="share.scanHint"></p>
    <canvas id="link-qr" class="qr-canvas"></canvas>
    <div class="btn-row">
      <button type="button" id="share-link-btn" class="btn btn-primary" data-i18n="btn.share">Share</button>
      <button type="button" id="copy-link-btn" class="btn" data-i18n="btn.copyLink">Copy</button>
    </div>
    <div class="field hidden" id="send-friends-block">
      <span data-i18n="sendTo.friends">Or send to a friend</span>
      <ul id="send-friends-list" class="entry-list send-friends"></ul>
    </div>
    <textarea id="link-output" readonly rows="2" aria-label="Move link"></textarea>
    <button type="button" id="send-close-btn" class="btn" data-i18n="btn.done">Done</button>
  </div>
</div>

<!-- Add a friend: share your own invite, or paste theirs -->
<div id="add-friend-modal" class="sheet-modal hidden" role="dialog" aria-modal="true" data-i18n-aria="friends.addButton">
  <div class="sheet sheet-compact">
    <h2 data-i18n="friends.addButton">Add Friend</h2>
    <p class="sheet-hint" data-i18n="addFriend.yourLinkHint"></p>
    <canvas id="friend-qr" class="qr-canvas"></canvas>
    <div class="btn-row">
      <button type="button" id="friend-share-btn" class="btn btn-primary" data-i18n="btn.share">Share</button>
      <button type="button" id="friend-copy-btn" class="btn" data-i18n="btn.copyLink">Copy</button>
    </div>
    <label class="field">
      <span data-i18n="addFriend.pasteLabel">Or paste their link</span>
      <input type="text" id="friend-paste-input" data-i18n-placeholder="addFriend.pastePlaceholder" />
    </label>
    <button type="button" id="friend-add-btn" class="btn btn-primary" data-i18n="addFriend.addBtn">Add</button>
    <button type="button" id="friend-close-btn" class="btn" data-i18n="btn.done">Done</button>
  </div>
</div>

<div id="app">
  <header class="app-header">
    <button type="button" id="back-btn" class="icon-btn icon-btn-left hidden" data-i18n-aria="btn.menu">‹</button>
    <h1 class="logo">CHECK<span>MATE</span></h1>
    <button type="button" id="settings-btn" class="icon-btn" data-i18n-aria="settings.title">⚙</button>
  </header>

  <!-- ============ MENU ============ -->
  <section id="screen-menu" class="screen">
    <div class="menu-grid">
      <button type="button" class="menu-card" id="menu-offline">
        <span class="menu-glyph">▦</span>
        <span class="menu-text">
          <span class="menu-title" data-i18n="menu.newOffline">New offline game</span>
          <span class="menu-sub" data-i18n="menu.newOfflineSub">Two players, one device</span>
        </span>
      </button>
      <button type="button" class="menu-card" id="menu-online">
        <span class="menu-glyph">◈</span>
        <span class="menu-text">
          <span class="menu-title" data-i18n="menu.newOnline">New online game</span>
          <span class="menu-sub" data-i18n="menu.newOnlineSub">Play at your own pace</span>
        </span>
      </button>
      <button type="button" class="menu-card" id="menu-continue">
        <span class="menu-glyph">▶</span>
        <span class="menu-text">
          <span class="menu-title" data-i18n="menu.continue">Continue</span>
          <span class="menu-sub" id="menu-continue-sub"></span>
        </span>
        <span class="menu-badge hidden" id="menu-badge"></span>
      </button>
      <button type="button" class="menu-card" id="menu-friends">
        <span class="menu-glyph">◍</span>
        <span class="menu-text">
          <span class="menu-title" data-i18n="menu.friends">Friends</span>
          <span class="menu-sub" id="menu-friends-sub"></span>
        </span>
      </button>
    </div>
  </section>

  <!-- ============ GAME SELECTION ============ -->
  <section id="screen-select" class="screen">
    <h2 class="screen-title" id="select-title" data-i18n="select.title">Choose a game</h2>
    <div id="game-picker" class="game-picker" role="group" data-i18n-aria="select.title"></div>
  </section>

  <!-- ============ CONTINUE ============ -->
  <section id="screen-continue" class="screen">
    <h2 class="screen-title" data-i18n="games.title">Your games</h2>
    <ul id="games-list" class="entry-list"></ul>
    <p id="games-empty" class="list-empty" data-i18n="games.empty"></p>
  </section>

  <!-- ============ FRIENDS ============ -->
  <section id="screen-friends" class="screen">
    <h2 class="screen-title" data-i18n="friends.title">Friends</h2>
    <p class="screen-hint" data-i18n="friends.hint"></p>
    <button type="button" id="add-friend-btn" class="btn btn-primary btn-lg" data-i18n="friends.addButton">Add Friend</button>
    <ul id="friends-list" class="entry-list"></ul>
    <p id="friends-empty" class="list-empty" data-i18n="friends.empty"></p>
  </section>

  <!-- ============ GAME ============ -->
  <section id="screen-game" class="screen">
    <div id="status-bar" class="status-bar" role="status"></div>

    <div class="main-area">
      <div class="board-section">
        <div id="board-wrap" class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="Game board"></div>
          <div id="handoff-screen" class="handoff-screen hidden">
            <p id="handoff-text"></p>
            <button type="button" id="handoff-ready-btn" class="btn btn-primary" data-i18n="btn.tapWhenReady">Tap when ready</button>
          </div>
          <div id="promotion-modal" class="promotion-modal hidden" role="dialog" aria-modal="true" data-i18n-aria="panel.choose">
            <div class="promotion-sheet">
              <h2 data-i18n="panel.choose">Choose</h2>
              <div class="promotion-choices"></div>
              <button type="button" class="btn" id="promotion-cancel-btn" data-i18n="btn.cancel">Cancel</button>
            </div>
          </div>
        </div>

        <div id="relay-status" class="relay-status online-only" role="status"></div>


        <div id="game-controls" class="game-controls">
          <button type="button" id="last-move-btn" class="btn" aria-pressed="false" data-i18n="btn.lastMove">Last move</button>
          <button type="button" id="rotate-btn" class="btn hotseat-only rotatable-only" data-i18n="btn.rotate">Rotate</button>
          <button type="button" id="undo-btn" class="btn hotseat-only" data-i18n="btn.undo">Undo</button>
          <button type="button" id="resign-btn" class="btn" data-i18n="btn.resign">Resign</button>
          <button type="button" id="draw-btn" class="btn hotseat-only" data-i18n="btn.draw">Draw</button>
          <button type="button" id="offer-draw-btn" class="btn online-only" data-i18n="btn.offerDraw">Offer Draw</button>
          <button type="button" id="share-btn" class="btn online-only" data-i18n="btn.shareGame">Share</button>
        </div>
      </div>

      <aside class="info-panel">
        <div id="draw-offer-banner" class="draw-offer-banner hidden">
          <span data-i18n="draw.offered">Opponent offers a draw</span>
          <div class="btn-row">
            <button type="button" id="accept-draw-btn" class="btn btn-primary" data-i18n="btn.accept">Accept</button>
            <button type="button" id="reject-draw-btn" class="btn" data-i18n="btn.decline">Decline</button>
          </div>
        </div>

        <div id="tutorial-panel" class="tutorial-panel hidden">
          <h2 data-i18n="panel.howToPlay">How to play</h2>
          <ul id="tutorial-list"></ul>
        </div>
      </aside>
    </div>
  </section>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
