<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Checkmate — Games by Link</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/board.css" />
<link rel="stylesheet" href="styles/games.css" />
<link rel="stylesheet" href="styles/mobile.css" />
<link rel="stylesheet" href="styles/desktop.css" />
</head>
<body>
<div id="live-region" aria-live="polite" class="sr-only"></div>

<div id="app">
  <header class="app-header">
    <h1 class="logo">CHECK<span>MATE</span></h1>
    <select id="lang-select" class="lang-select" data-i18n-aria="lang.label"></select>
  </header>

  <nav class="mode-switch" role="group" aria-label="Game mode">
    <button type="button" class="mode-btn" data-mode="hotseat" data-i18n="mode.hotseat">Hotseat</button>
    <button type="button" class="mode-btn" data-mode="online" data-i18n="mode.online">Online</button>
  </nav>

  <div id="status-bar" class="status-bar" role="status"></div>

  <main id="main-area" class="main-area">
    <section id="board-section" class="board-section">
      <div id="board-wrap" class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Game board"></div>
        <div id="handoff-screen" class="handoff-screen hidden">
          <p id="handoff-text"></p>
          <button type="button" id="handoff-ready-btn" class="btn btn-primary" data-i18n="btn.tapWhenReady">Tap when ready</button>
        </div>
        <div id="promotion-modal" class="promotion-modal hidden" role="dialog" aria-modal="true" data-i18n-aria="panel.choose">
          <div class="promotion-sheet">
            <h2 data-i18n="panel.choose">Choose</h2>
            <div class="promotion-choices"></div>
            <button type="button" class="btn" id="promotion-cancel-btn" data-i18n="btn.cancel">Cancel</button>
          </div>
        </div>
      </div>

      <div id="relay-status" class="relay-status online-only" role="status"></div>

      <!-- Send-move panel: appears in online mode after your move -->
      <div id="send-panel" class="send-panel hidden">
        <h3 class="step-label" data-i18n="panel.sendMove">Send your move</h3>
        <div class="btn-row">
          <button type="button" id="share-link-btn" class="btn btn-primary" data-i18n="btn.share">Share</button>
          <button type="button" id="copy-link-btn" class="btn" data-i18n="btn.copyLink">Copy Link</button>
          <button type="button" id="qr-link-btn" class="btn" data-i18n="btn.qr">QR</button>
        </div>
        <canvas id="link-qr" class="qr-canvas hidden"></canvas>
        <textarea id="link-output" readonly rows="2" aria-label="Move link"></textarea>
      </div>

      <div id="game-controls" class="game-controls">
        <button type="button" id="new-game-btn" class="btn" data-i18n="btn.newGame">New Game</button>
        <button type="button" id="rotate-btn" class="btn hotseat-only rotatable-only" data-i18n="btn.rotate">Rotate</button>
        <button type="button" id="undo-btn" class="btn hotseat-only" data-i18n="btn.undo">Undo</button>
        <button type="button" id="resign-btn" class="btn" data-i18n="btn.resign">Resign</button>
        <button type="button" id="draw-btn" class="btn hotseat-only" data-i18n="btn.draw">Draw</button>
        <button type="button" id="offer-draw-btn" class="btn online-only" data-i18n="btn.offerDraw">Offer Draw</button>
      </div>
    </section>

    <aside id="info-panel" class="info-panel">
      <div id="setup-panel" class="setup-panel">
        <div id="game-picker" class="game-picker" role="group" aria-label="Choose a game"></div>

        <div id="hotseat-setup" class="setup-block">
          <p class="setup-hint" data-i18n="setup.hotseatHint"></p>
          <button type="button" id="start-hotseat-btn" class="btn btn-primary btn-lg" data-i18n="setup.startGame">Start Game</button>
          <label class="toggle-row rotatable-only">
            <input type="checkbox" id="rotate-toggle" />
            <span data-i18n="setup.rotateToggle">Rotate board each turn</span>
          </label>
          <label class="toggle-row">
            <input type="checkbox" id="handoff-toggle" />
            <span data-i18n="setup.handoffToggle">Show handoff screen</span>
          </label>
        </div>

        <div id="online-setup" class="setup-block">
          <p class="setup-hint" data-i18n="setup.onlineHint"></p>
          <button type="button" id="start-online-btn" class="btn btn-primary btn-lg">
            <span data-i18n="setup.newGame">New Game</span>
            <span class="btn-sub" data-i18n="setup.youMoveFirst">You move first</span>
          </button>
          <p class="setup-hint dim" data-i18n="setup.receivedLink"></p>
        </div>
      </div>

      <div id="draw-offer-banner" class="draw-offer-banner hidden">
        <span data-i18n="draw.offered">Opponent offers a draw</span>
        <div class="btn-row">
          <button type="button" id="accept-draw-btn" class="btn btn-primary" data-i18n="btn.accept">Accept</button>
          <button type="button" id="reject-draw-btn" class="btn" data-i18n="btn.decline">Decline</button>
        </div>
      </div>

      <div id="move-history-panel" class="move-history-panel">
        <h2 data-i18n="panel.moves">Moves</h2>
        <ol id="move-history-list"></ol>
      </div>
    </aside>
  </main>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
